<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản bị tạm khóa - PetBuddy</title>
</head>

<body style="margin:0;padding:0;background:#f2f9ff;font-family:Arial, sans-serif">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:30px 10px">
    <tr>
        <td align="center">

            <table width="480" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:16px;padding:30px;border:1px solid #d8efff">

                <tr>
                    <td align="center">
                        <h1 style="margin:0;color:#38aeea;">🐾 PetBuddy</h1>
                        <p style="margin:6px 0 22px;color:#7aaec8;font-size:13px">
                            Cửa hàng chăm sóc thú cưng
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center">
                        <h2 style="color:#c0392b;margin-bottom:10px">
                            Tài khoản đã bị tạm khóa
                        </h2>

                        <p style="color:#667085;font-size:14px;line-height:1.6">
                            Tài khoản của bạn đã bị tạm khóa do có <b th:text="${failCount}"></b> lần liên tiếp
                            không hoàn tất thanh toán đơn hàng.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center">
                        <div style="
                            margin:25px 0;
                            padding:18px;
                            background:#fdecea;
                            border:1px dashed #c0392b;
                            border-radius:12px;
                            font-size:16px;
                            font-weight:bold;
                            color:#c0392b;
                        ">
                            🔒 Tài khoản tạm khóa
                        </div>
                    </td>
                </tr>

                <tr>
                    <td align="center">
                        <div style="
                            margin-top:10px;
                            padding:12px;
                            background:#fff8e6;
                            border-radius:10px;
                            font-size:13px;
                            color:#9a6b00;
                            line-height:1.5;
                        ">
                            ⚠️ Vui lòng liên hệ bộ phận hỗ trợ để được mở lại tài khoản.
                        </div>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding-top:25px">
                        <p style="font-size:12px;color:#a0aec0;line-height:1.5">
                            PetBuddy Store — mọi thắc mắc xin liên hệ bộ phận hỗ trợ.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
